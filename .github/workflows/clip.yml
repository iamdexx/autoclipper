name: clip
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # GitHub's schedule has skipped whole afternoons. A comment "/run-clipper" on any issue or PR,
  # from the repo owner or the Devin app, starts a run on main.
  issue_comment:
    types: [created]
jobs:
  # A comment-triggered run gets a read-only cache token, so it could not save its state and
  # the next run posted the same video again. The comment therefore only dispatches a normal run.
  start:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/run-clipper') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.user.login == 'devin-ai-integration[bot]')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run clip.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  run:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency: autoclipper
    steps:
      # the runner ships ~14 GB free; a long VOD plus its clips has run it out of disk
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: restore state + posting queue
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/queue
          key: autoclipper-state-${{ github.run_id }}
          restore-keys: autoclipper-state-
      - run: autoclipper run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Geminikey }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.elevenlabskey }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'eastus' }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'PUBLIC_TO_EVERYONE' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          PUBLIC_S3_BUCKET: ${{ secrets.PUBLIC_S3_BUCKET }}
          PUBLIC_S3_ENDPOINT: ${{ secrets.PUBLIC_S3_ENDPOINT }}
          PUBLIC_S3_KEY: ${{ secrets.PUBLIC_S3_KEY }}
          PUBLIC_S3_SECRET: ${{ secrets.PUBLIC_S3_SECRET }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      - name: save state + posting queue
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/queue
          key: autoclipper-state-${{ github.run_id }}
      # debugging aid only: the videos are already posted/queued by now, so a full artifact
      # store (the 500 MB free quota) must not turn the run red
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: clips
          path: |
            data/videos/*/clips/*.mp4
            data/top10/*/*.mp4
          if-no-files-found: ignore
          retention-days: 2
