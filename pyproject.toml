[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclipper"
version = "0.1.0"
description = "Watch creators' streams, find the viral moments, cut captioned 9:16 clips, and auto-post them to TikTok / Instagram Reels / YouTube Shorts."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default]>=2025.11.12",
  "faster-whisper>=1.1.0",
  "requests>=2.32",
  "pyyaml>=6.0",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "boto3>=1.35",
  "edge-tts>=7.0,<8",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autoclipper = "autoclipper.cli:main"

[tool.setuptools.packages.find]
include = ["autoclipper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
