# Creators to watch. Every new upload/VOD >= min_duration_s gets clipped automatically.
creators:
  - name: Kai Cenat
    handle: "@KaiCenatLive"
    hashtags: ["#kaicenat", "#amp"]
  - name: IShowSpeed
    handle: "@LiveSpeedy"      # full-stream uploads (the main @IShowSpeed channel is edited vlogs)
    hashtags: ["#ishowspeed", "#speed"]
  - name: xQc
    handle: "@xQcOW"
    hashtags: ["#xqc", "#twitch"]
  - name: Adin Ross
    handle: "@adinross"
    hashtags: ["#adinross", "#kick"]

workdir: data
whisper_model: base          # tiny/base/small/medium — bigger = better captions, slower
llm_provider: auto           # auto | nvidia | gemini | anthropic | openai | heuristic
# NVIDIA models, in the order they are tried. The run's log ends with a "tool report" line per
# model and voice (calls that worked / failed); reorder these when one keeps failing.
nvidia_text_models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b]
nvidia_vision_models: [nvidia/nemotron-3.5-super-vl-120b-a12b, nvidia/nemotron-3-nano-omni-30b-a3b-reasoning]
poll_interval_s: 900
max_videos_per_run: 2

clips:
  count: 3
  min_len_s: 20
  max_len_s: 60
  target_len_s: 40
  tail_s: 1.0           # footage rolls on this long after the last line, audio easing out
  heuristic_fallback: false  # AI editor unavailable: make nothing and retry the video later (true = cut by keywords)

captions:
  style: highlight # every format: 3-word line, the word being spoken turns yellow; `word` = one big white word at a time
  size: 64
  words_per_line: 3 # highlight style only

look:
  reframe: crop      # the picture fills the 9:16 frame, cropped to the speaker's face (blur = letterboxed over a blurred copy)
  watermark: "@Clipverse-HQ"   # small handle in the top corner of every video

publishing:
  dry_run: false             # real posts; `true` only logs what would be posted
  youtube: true              # YT_TOKEN_JSON secret (Clipverse-HQ)
  tiktok: false              # enable once TIKTOK_* credentials exist (see README)
  instagram: false           # enable once IG_* + PUBLIC_* credentials exist (see README)
  max_per_day: 6             # per platform; YouTube's default API quota allows 6 uploads/day
  min_gap_min: 150           # spread posts out; finished videos wait in data/queue for a slot
  schedule_ahead_h: 12       # a run uploads queued videos as scheduled YouTube posts this far ahead
  queue_max_age_h: 48        # the best-scoring queued video posts first; the rest age out
  queue_max_items: 24
  own_share: 0.5             # half the posts are our own narrated videos (top10), ahead of better-scoring clips
  cta: "Subscribe to Clipverse HQ for GTA 6 and gaming news, details and the best moments, every day."
  outro: "Subscribe for more stories like this."  # spoken + captioned at the end of our own videos; "" = off

narration:
  provider: auto        # auto = nvidia > edge (no key) > azure > google > elevenlabs > gemini > openai, next one when a call fails | off
  edge_voice: en-US-GuyNeural  # AndrewMultilingual/BrianMultilingual/Christopher/Roger ... (edge-tts --list-voices)
  edge_rate: 1.05
  azure_voice: en-US-GuyNeural  # AndrewMultilingual/BrianMultilingual/Davis/Steffan/Christopher ...
  azure_rate: 1.05
  google_voice: Charon  # Cloud TTS Chirp 3 HD: Fenrir, Orus, Puck, Algenib, Iapetus ...
  google_rate: 1.0
  nvidia_voices: [Jason, Aria, Leo, Mia]  # take turns, one voice per video; also Diego, Isabela, Louise, Pascal, Ray, Sofia
  gemini_voice: Puck    # Kore, Charon, Fenrir, Aoede, Leda ...
  duck_db: -14
  max_len_s: 3.5        # the narrator's hook: one line, then the clip; longer is sped up (max 1.3x) or dropped
  take: true            # after the clip the narrator adds the channel's own fact-checked commentary
  take_max_s: 9.0       # over the footage rolling on, ducked; longer is sped up (max 1.3x)

# Trend mode: scrape what's blowing up, let the LLM pick topics, find the best source video and
# clip it like a stream. The channel is GTA 6 first: anything whose title doesn't name one of
# focus_keywords is skipped (trend topics, source videos and the creators' uploads above), except
# in the three "other gaming" pillars at the end of the mix, which match their own `keywords`.
trends:
  enabled: true
  focus: "GTA 6 (Grand Theft Auto VI) first, plus the biggest other video game news"
  focus_keywords: ["gta 6", "gta vi", "gta", "grand theft auto"]
  # never clipped: league and broadcast footage is what got uploads blocked by Content ID claims
  exclude_keywords: ["nba", "nfl", "mlb", "nhl", "ufc", "wwe", "premier league", "champions league",
                     "uefa", "fifa", "la liga", "serie a", "bundesliga", "f1", "formula 1",
                     "formula one", "grand prix", "atp", "wta", "wimbledon", "cricket", "ipl",
                     "nascar", "world cup", "super bowl", "highlights", "touchdown",
                     "interception", "postgame"]
  geos: ["US"]
  topics_per_run: 2
  min_duration_s: 120
  max_duration_s: 7200
  max_source_age_h: 72      # sources are searched freshest-first (last hour, today, any); older than this never
  # source channels never clipped from (exact name; also blocks the name's regional channels,
  # e.g. "Rockstar Games Polska"): raw cuts of the publisher's own trailers
  # are the likeliest GTA uploads to be claimed
  blocked_channels: ["Rockstar Games"]
  # source quality: spoken language must be one of these, and a person has to be on camera
  # (text-to-speech over screenshots shows a face in almost no frames)
  languages: ["en"]
  min_face_share: 0.05
  # The topic mix. Every run takes its topics from the pillars used least recently, one each, so
  # the channel keeps rotating through all of them. max_share caps a pillar's share of the last
  # pillar_window topics. 8 GTA 6 pillars + 3 other-gaming ones = about 73% GTA 6.
  pillar_window: 20
  pillars:
    - name: news
      queries: ["GTA 6 news", "GTA 6 release date", "Rockstar Games GTA 6 announcement"]
      angle: "what Rockstar or Take-Two just confirmed, and what it means for players"
    - name: trailers and details
      queries: ["GTA 6 trailer breakdown", "GTA 6 trailer details you missed", "GTA 6 screenshots analysis"]
      angle: "one detail from the official trailers or screenshots most people missed"
    - name: map and world
      queries: ["GTA 6 map", "GTA 6 Vice City Leonida", "GTA 6 locations"]
      angle: "a place in Vice City or Leonida and what is known about it"
    - name: characters and story
      queries: ["GTA 6 Jason and Lucia", "GTA 6 characters", "GTA 6 story"]
      angle: "who a character is and what the official material shows about them"
    - name: gameplay and features
      queries: ["GTA 6 gameplay features", "GTA 6 cars and vehicles", "GTA 6 online"]
      angle: "one confirmed feature, vehicle or mechanic and why it matters"
    - name: gta 5 vs gta 6
      queries: ["GTA 5 vs GTA 6 comparison", "GTA 6 graphics comparison"]
      angle: "one concrete side by side difference from the older games"
    - name: streamers and community
      queries: ["streamer reacts GTA 6", "GTA 6 reaction", "GTA RP funniest moments"]
      angle: "a real reaction or funny moment from a streamer or the GTA community"
    - name: clipping gta 6
      queries: ["make money clipping GTA 6", "GTA 6 clipping channel", "GTA 6 content creator tips"]
      angle: "how people build channels clipping GTA 6: practical steps, no income promises"
      max_share: 0.15
    # other gaming (not GTA): what the channel's best videos so far were about
    - name: gaming news
      queries: ["gaming news today", "video game news this week"]
      angle: "the biggest video game story right now that is not about GTA, and what it means for players"
      keywords: &gaming ["video game", "video games", "gaming", "gameplay", "nintendo", "switch 2", "zelda", "mario", "pokemon", "playstation", "ps5", "ps6", "xbox", "steam deck"]
    - name: consoles and tech
      queries: ["Switch 2 news", "PS5 Xbox news", "Digital Foundry analysis"]
      angle: "one console, hardware or performance story players are talking about"
      keywords: *gaming
    - name: new games and remakes
      queries: ["new game reveal trailer reaction", "video game remake remaster news"]
      angle: "a newly revealed game, sequel or remake and what was actually shown"
      keywords: *gaming

# "Top 10 ..." countdown videos: LLM writes the list, narrator voices every entry over footage
# pulled from YouTube, stitched into one vertical video with rank badges + captions.
top10:
  enabled: true
  per_run: 1
  style: explainer      # explainer (a scripted "How / Why ..." story over real photos, every beat fact-checked) |
                        # ranking (clips + title banner + filling 1..N list, clip audio) |
                        # ranking (clips + title banner + filling 1..N list, clip audio) |
                        # countdown (Top 10 with rank badges + narrator) | listicle (photos + narrator)
  narrate: true         # ranking: Liam voices a hook + one line per clip (false = clip audio only)
  items: 7              # explainer: beats (~50s); ranking ~6; countdown 10
  open_topic_every: 0   # explainer: every Nth one is on any subject (history, science, ...); 0 = never
  focus_only: true      # explainer: GTA 6 pillars only (clips still follow the whole topic mix)
  item_min_s: 3.5
  outro_s: 2.0          # #1's footage plays on (its audio back up) this long after the last line
  listicle_outro_s: 0.8 # listicle: the last photo holds this long after the last word
  cuts_per_entry: 1     # footage cuts per entry, each with a zoom punch (2 suits countdown)
  sfx: true             # whoosh/hit on every rank reveal
  source_db: -26        # footage's own audio under the narration (-100 = effectively mute)
  music: elevenlabs     # one continuous bed, start to end: elevenlabs (Music API, needs the
                        # music_generation permission on your key) | synth | off
  music_dir: ""         # folder of your own tracks; used if set / if generation fails
  music_db: -14         # bed level relative to the narration
  music_prompt: "curious, cinematic documentary underscore, soft pulse and warm synths, 100 bpm, steady build, no vocals"
  topics: []            # fixed ideas e.g. ["craziest NFL plays this week"]; empty = from trends

verify:                # fact-check gate for everything the narrator says (see README)
  enabled: true
  strict: false        # true = also drop entries that couldn't be verified either way (creator hooks too)
  strict_top10: true   # Top-N entries must be positively supported; the script is written from real headlines
  min_confidence: 0.5
  min_entries: 5       # skip the video if fewer entries survive the check (7 for a Top 10)
  max_rounds: 2        # script rewrites to replace dropped entries
  check_hooks: true    # creator/trend clips: narrator hook must match the transcript

review:                # editor's pass: a vision model watches every finished video against a viewer's checklist
  enabled: true        # (English, clean captions, no other channel's overlays, says something, not cut off);
  frames: 8            # nothing is posted until it passes, a fail is deleted, an unreviewable one waits
  max_attempts: 6

qa:                    # quality gate on every finished video; a failing video is never published
  enabled: true        # report lands in <video>.qa.json either way
  clip_min_s: 15
  clip_max_s: 90
  top10_min_s: 12
  top10_max_s: 90
  min_mean_db: -30     # average loudness window (too quiet = narration buried or missing)
  max_mean_db: -8
  max_peak_db: -0.1    # clipping
  max_silence_s: 1.5   # dead air
  max_black_s: 0.5     # black frames
  max_freeze_s: 3.0    # frozen picture
  check_speech: true   # re-transcribe the output and compare with the script
  min_speech_match: 0.6
