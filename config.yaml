# Creators to watch. Every new upload/VOD >= min_duration_s gets clipped automatically.
creators:
  - name: Adin Ross
    handle: "@AdinLive"
    hashtags: ["#adinross", "#kick"]
  - name: Kai Cenat
    handle: "@KaiCenatLive"
    hashtags: ["#kaicenat", "#amp"]

workdir: data
whisper_model: base          # tiny/base/small/medium — bigger = better captions, slower
llm_provider: auto           # auto | gemini | anthropic | openai | heuristic
poll_interval_s: 900
max_videos_per_run: 2

clips:
  count: 3
  min_len_s: 20
  max_len_s: 60
  target_len_s: 40

captions:
  style: highlight # every format: 3-word line, the word being spoken turns yellow; `word` = one big white word at a time
  size: 64
  words_per_line: 3 # highlight style only

publishing:
  dry_run: true              # flip to false once the platform credentials are set
  youtube: true
  tiktok: true
  instagram: true

narration:
  provider: auto        # auto = edge (no key) > azure > google > elevenlabs > gemini > openai, next one when a call fails | off
  edge_voice: en-US-GuyNeural  # AndrewMultilingual/BrianMultilingual/Christopher/Roger ... (edge-tts --list-voices)
  edge_rate: 1.05
  azure_voice: en-US-GuyNeural  # AndrewMultilingual/BrianMultilingual/Davis/Steffan/Christopher ...
  azure_rate: 1.05
  google_voice: Charon  # Cloud TTS Chirp 3 HD: Fenrir, Orus, Puck, Algenib, Iapetus ...
  google_rate: 1.0
  gemini_voice: Puck    # Kore, Charon, Fenrir, Aoede, Leda ...
  duck_db: -14
  max_len_s: 6

# Trend mode: scrape what's blowing up (Google Trends + fresh YouTube uploads per niche), let the
# LLM pick topics that fit your niches, find the best source video and clip it like a stream.
trends:
  enabled: true
  niches: ["sports highlights", "gaming", "celebrity and internet drama", "tech news"]
  geos: ["US"]
  topics_per_run: 2
  min_duration_s: 120
  max_duration_s: 7200

# "Top 10 ..." countdown videos: LLM writes the list, narrator voices every entry over footage
# pulled from YouTube, stitched into one vertical video with rank badges + captions.
top10:
  enabled: true
  per_run: 1
  style: ranking        # ranking (clips + title banner + filling 1..N list, clip audio) |
                        # countdown (Top 10 with rank badges + narrator) | listicle (photos + narrator)
  narrate: true         # ranking: Liam voices a hook + one line per clip (false = clip audio only)
  items: 6              # ranking ~6 (20-30s video); countdown 10
  item_min_s: 3.5
  cuts_per_entry: 1     # footage cuts per entry, each with a zoom punch (2 suits countdown)
  sfx: true             # whoosh/hit on every rank reveal
  source_db: -26        # footage's own audio under the narration (-100 = effectively mute)
  music: elevenlabs     # one continuous bed, start to end: elevenlabs (Music API, needs the
                        # music_generation permission on your key) | synth | off
  music_dir: ""         # folder of your own tracks; used if set / if generation fails
  music_db: -14         # bed level relative to the narration
  topics: []            # fixed ideas e.g. ["craziest NFL plays this week"]; empty = from trends

verify:                # fact-check gate for everything the narrator says (see README)
  enabled: true
  strict: false        # true = also drop entries that couldn't be verified either way
  min_confidence: 0.5
  min_entries: 4       # skip the video if fewer entries survive the check (7 for a Top 10)
  max_rounds: 2        # script rewrites to replace dropped entries
  check_hooks: true    # creator/trend clips: narrator hook must match the transcript

qa:                    # quality gate on every finished video; a failing video is never published
  enabled: true        # report lands in <video>.qa.json either way
  clip_min_s: 15
  clip_max_s: 90
  top10_min_s: 12
  top10_max_s: 90
  min_mean_db: -30     # average loudness window (too quiet = narration buried or missing)
  max_mean_db: -8
  max_peak_db: -0.1    # clipping
  max_silence_s: 1.5   # dead air
  max_black_s: 0.5     # black frames
  max_freeze_s: 3.0    # frozen picture
  check_speech: true   # re-transcribe the output and compare with the script
  min_speech_match: 0.6
